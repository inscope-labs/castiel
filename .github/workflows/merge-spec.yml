name: merge-spec

# Reusable workflow. Merges every individual spec file in one spec directory
# into a single file at the root of that directory (<dir-name>.merged.md).
# Called by the per-spec workflows merge-spec-amk-*.yml.

on:
  workflow_call:
    inputs:
      spec_dir:
        description: "Spec directory, for example specs/core/amk-console"
        required: true
        type: string
      mode:
        description: "pr = open or update a pull request; commit = push to the current branch"
        required: false
        type: string
        default: pr

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-spec-${{ inputs.spec_dir }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      SPEC_DIR: ${{ inputs.spec_dir }}
      MODE: ${{ inputs.mode }}
      BASE_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          case "$SPEC_DIR" in
            *..*) echo "::error::spec_dir must not contain '..'"; exit 1 ;;
            specs/core/amk-*) ;;
            *) echo "::error::spec_dir must be under specs/core/amk-*"; exit 1 ;;
          esac
          case "$MODE" in
            pr|commit) ;;
            *) echo "::error::mode must be pr or commit"; exit 1 ;;
          esac

      - name: Check that the spec directory exists
        id: dir
        run: |
          if [ -f "$SPEC_DIR/$(basename "$SPEC_DIR").md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SPEC_DIR (or its index file) does not exist yet; nothing to merge."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge spec files
        if: steps.dir.outputs.exists == 'true'
        run: python3 specs/scripts/merge_spec.py --dir "$SPEC_DIR"

      - name: Commit or open a pull request
        if: steps.dir.outputs.exists == 'true'
        run: bash specs/scripts/merge_spec_publish.sh
